[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsp-record-protocol"
version = "0.2.0"
description = "Experimental, application-independent Generativity record graph protocol"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "rfc8785>=0.1.4,<0.2"]
license = "MIT"
license-files = ["LICENSE", "CONTRIBUTORS.md"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gsp-protocol = "gsp_protocol.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gsp_protocol = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
